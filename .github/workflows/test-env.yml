# Throwaway AWS test environments (decision T-43): Actions → "Test environment" → Run workflow,
# choose the branch and up, down, status or unlock. Every 30 minutes a check takes down an
# environment past its deadline (its lifetime, chosen at `up`, counted from when it was created).
# Made-up data only. Never cancel an `up` or a `down` half way; if one was, run `unlock`, then
# `down` (infra/terraform/README.md, "A run that was stopped").
#
# Signs in to AWS with OIDC as the role the bootstrap made (repository variable
# AWS_TEST_ROLE_ARN). Two GitHub environments: `test` (up, unlock) waits for the owner's approval;
# `test-teardown` (down, reap, status) does not, so the teardown never waits for anyone, and only
# the dev branch may use it. Without the variable it does nothing.
name: Test environment

on:
  workflow_dispatch:
    inputs:
      action:
        description: What to do
        type: choice
        options: [up, down, status, unlock]
        default: status
      lifetime_minutes:
        description: For up, how long it lives (from when it is first created)
        type: choice
        options: ['180', '120', '60', '45']
        default: '180'
  schedule:
    - cron: '*/30 * * * *'

# Manual runs queue behind each other; the teardown check has its own queue, because GitHub keeps
# one waiting run per queue and a newer one cancels it (a check must never cancel an `up` that
# waits for approval). The check steps aside while a manual run is busy (below).
concurrency:
  group: ${{ github.event_name == 'schedule' && 'test-environment-teardown' || 'test-environment' }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read
  actions: read

env:
  AWS_REGION: eu-north-1

jobs:
  run:
    name: ${{ github.event_name == 'schedule' && 'Teardown check' || inputs.action }}
    runs-on: ubuntu-latest
    environment: ${{ (github.event_name == 'workflow_dispatch' && (inputs.action == 'up' || inputs.action == 'unlock')) && 'test' || 'test-teardown' }}
    timeout-minutes: 75
    env:
      ACTION: ${{ github.event_name == 'schedule' && 'reap' || inputs.action }}
      TTL_MINUTES: ${{ inputs.lifetime_minutes }}
      # `true` once CodeBuild may run builds in the account (its quota starts at 0): AWS then also
      # takes the environment down on the minute, without GitHub. A variable of the repository.
      SCHEDULED_TEARDOWN: ${{ vars.TEST_SCHEDULED_TEARDOWN }}
      # Google Maps for the customer and seller sites (variables of the `test` environment): a
      # browser key, limited in Google Cloud to https://*.am.amahkudi.dev/*, and a map id.
      GOOGLE_MAPS_BROWSER_KEY: ${{ vars.GOOGLE_MAPS_BROWSER_KEY }}
      GOOGLE_MAP_ID: ${{ vars.GOOGLE_MAP_ID }}
    steps:
      - name: Is AWS set up?
        id: ready
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "${{ vars.AWS_TEST_ROLE_ARN }}" ]; then
            echo "::notice::AWS_TEST_ROLE_ARN is not set (infra/terraform/README.md, Test environments); nothing to do."
            echo "go=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The teardown check never runs beside a manual run: an `up` may be half way.
          if [ "$ACTION" = "reap" ]; then
            busy=0
            for status in queued waiting in_progress requested pending; do
              n=$(gh run list -R "$GITHUB_REPOSITORY" --workflow test-env.yml --event workflow_dispatch                 --status "$status" --json databaseId --jq length)
              busy=$((busy + n))
            done
            if [ "$busy" -gt 0 ]; then
              echo "::notice::A manual run is queued, waiting or running; the teardown check waits for the next round."
              echo "go=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          # Taking the lock is only safe when nothing else holds it: no other run of this workflow
          # (a manual one, or the teardown check) may be going.
          if [ "$ACTION" = "unlock" ]; then
            others=$(gh run list -R "$GITHUB_REPOSITORY" --workflow test-env.yml --status in_progress \
              --json databaseId --jq "[.[] | select(.databaseId != $GITHUB_RUN_ID)] | length")
            if [ "$others" -gt 0 ]; then
              echo "::error::Another run of this workflow is going; it holds the lock. Nothing was changed."
              exit 1
            fi
          fi
          echo "go=true" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.ready.outputs.go == 'true'
        uses: actions/checkout@v7

      - name: AWS credentials
        if: steps.ready.outputs.go == 'true'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_TEST_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          # An `up` takes about 30 minutes; the role allows sessions of one hour.
          role-duration-seconds: 3600

      - name: Setup Terraform
        if: steps.ready.outputs.go == 'true'
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.13.5
          terraform_wrapper: false

      - name: Setup Docker Buildx
        if: steps.ready.outputs.go == 'true' && env.ACTION == 'up'
        uses: docker/setup-buildx-action@v4

      - name: Setup Node
        if: steps.ready.outputs.go == 'true' && env.ACTION == 'up'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: ${{ env.ACTION }}
        if: steps.ready.outputs.go == 'true'
        run: bash infra/deploy/test-env.sh "$ACTION"
