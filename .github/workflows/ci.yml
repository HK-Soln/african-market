name: CI

# The shared quality gate. Runs on every pull request and on every push to the three long-lived
# branches (dev -> stage -> main). Most jobs are REQUIRED status checks in the branch rulesets
# (infra/github/rulesets; the table is in docs/architecture/branching-and-cicd.md), so renaming
# a job means updating those files too.

on:
  pull_request:
  push:
    branches: [dev, stage, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NX_NO_CLOUD: 'true'
  # Throwaway values for the ephemeral CI services, not secrets. The apps have no defaults for
  # these (they differ per environment), so every job gets the full set.
  DATABASE_URL: postgres://am:am@localhost:5432/african_market
  REDIS_URL: redis://localhost:6379
  RABBITMQ_URL: amqp://am:am@localhost:5672
  SMTP_URL: smtp://localhost:1025
  MAILPIT_URL: http://localhost:8025
  EMAIL_FROM: African Market <no-reply@africanmarket.local>
  SMS_PROVIDER: console
  JWT_ACCESS_SECRET: dev-only-access-secret-change-me-0123456789
  OTP_HMAC_SECRET: dev-only-otp-hmac-secret-change-me-0123456789
  CORS_ORIGINS: http://localhost:3000,http://localhost:3001,http://localhost:3002
  CURRENT_PHASE: '0'
  TRUST_PROXY_HOPS: '0'
  NEXT_PUBLIC_GATEWAY_URL: http://localhost:4000
  NEXT_PUBLIC_WEB_URL: http://localhost:3000
  IDENTITY_HOST: localhost
  SHOPS_HOST: localhost
  CATALOG_HOST: localhost
  DISCOVERY_HOST: localhost
  MEDIA_HOST: localhost
  MESSAGING_HOST: localhost
  NOTIFICATIONS_HOST: localhost
  ORDERS_HOST: localhost
  PAYMENTS_HOST: localhost

jobs:
  verify:
    name: Format · Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Integration tests in apps/*/test run under `nx test`. They create their own throwaway
    # databases on a PostGIS container they start with Testcontainers (libs/database/src/testing);
    # the Postgres service below is for the tests that boot a whole service. They
    # use their own key prefix on this Redis (rate limits). Mailpit receives the emails the SMTP
    # adapter sends. The event bus and outbox tests use their own exchange and queues on RabbitMQ.
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: am
          POSTGRES_PASSWORD: am
          POSTGRES_DB: african_market
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U am -d african_market"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mailpit:
        image: axllent/mailpit:latest
        ports: ['1025:1025', '8025:8025']
      rabbitmq:
        image: rabbitmq:3.13-alpine
        env:
          RABBITMQ_DEFAULT_USER: am
          RABBITMQ_DEFAULT_PASS: am
        ports: ['5672:5672']
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # nx affected needs history to find the merge base

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Pull requests compare against their target branch (a feature PR against dev, a promotion
      # PR against stage or main). Pushes compare against the last green run on that branch.
      - name: Derive affected base and head
        uses: nrwl/nx-set-shas@v5
        with:
          main-branch-name: ${{ github.base_ref || github.ref_name }}

      - name: Format
        run: pnpm format:check

      - name: Lint · Typecheck · Test · Build (affected)
        run: pnpm nx affected -t lint typecheck test build --parallel=3

  migrations:
    name: Migrations (PostGIS)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: am
          POSTGRES_PASSWORD: am
          POSTGRES_DB: african_market
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U am -d african_market"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Every service's migrations, in order, against an empty database. Always the full set,
      # never "affected": a migration that only works on top of local state must fail here.
      # infra/docker/postgres-init.sql is deliberately NOT applied, because RDS will not have it:
      # each service's first migration must create its own schema and extensions.
      - name: Run all migrations
        run: pnpm migration:run

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The core journeys in a real browser, in English and Arabic, against the real images: the
    # stack runs in containers (docker-compose.e2e.yml: NODE_ENV=test, in-memory SMS), built from
    # the same Dockerfiles as staging and production. A required check (decided 2026-10-16).
    # The @smoke tests run here too, with throwaway test numbers, and again on staging after each
    # deploy (deploy.yml).
    env:
      WEB_HOST_PORT: '3100'
      GATEWAY_HOST_PORT: '4100'
      E2E_BASE_URL: http://localhost:3100
      E2E_GATEWAY_URL: http://localhost:4100
      # The same throwaway numbers as identity's OTP_TEST_NUMBERS in docker-compose.e2e.yml.
      E2E_TEST_NUMBERS: '+971500000001:135790,+971500000002:246801'
      COMPOSE: docker compose -f docker-compose.yml -f docker-compose.e2e.yml --profile apps
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Expose the GitHub cache to Buildx
        uses: crazy-max/ghaction-github-runtime@v3

      # Layers come from the GitHub Actions cache, so an unchanged dependency set or app is not
      # rebuilt. One scope per image, so they do not overwrite each other.
      - name: Build the images
        run: |
          docker buildx bake -f docker-compose.yml -f docker-compose.e2e.yml --load \
            --set identity.cache-from=type=gha,scope=identity \
            --set identity.cache-to=type=gha,scope=identity,mode=max \
            --set gateway.cache-from=type=gha,scope=gateway \
            --set gateway.cache-to=type=gha,scope=gateway,mode=max \
            --set web.cache-from=type=gha,scope=web-e2e \
            --set web.cache-to=type=gha,scope=web-e2e,mode=max \
            identity gateway web

      - name: Start the stack
        run: $COMPOSE up -d --wait --wait-timeout 300 web

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run the end-to-end tests
        run: pnpm e2e

      - name: Show the app logs
        if: ${{ failure() }}
        run: $COMPOSE logs --no-color --tail 200 identity gateway web

      - name: Upload the Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
          if-no-files-found: ignore

  images:
    name: Images (build · scan)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Builds the image of every app this change touches, as the deploy will, and scans it with
    # Trivy. Not blocking yet (F0-14): findings go to the Security tab, the job passes.
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # nx affected needs history to find the merge base

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Only the apps that run in this phase have images (the default group in docker-bake.hcl).
      - name: Find the affected apps
        id: affected
        run: |
          base=${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD~1' }}
          deployed=$(docker buildx bake -f infra/docker/docker-bake.hcl --print 2>/dev/null \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).group.default.targets.join(' ')))")
          affected=$(pnpm -s nx show projects --affected --base="$base" --projects 'tag:app' | sed 's#^@am/##' | tr '\n' ' ')
          apps=$(for app in $deployed; do case " $affected " in *" $app "*) printf '%s ' "$app";; esac; done)
          echo "Affected apps with an image: ${apps:-none}"
          echo "apps=$apps" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        if: ${{ steps.affected.outputs.apps != '' }}
        uses: docker/setup-buildx-action@v3

      - name: Expose the GitHub cache to Buildx
        if: ${{ steps.affected.outputs.apps != '' }}
        uses: crazy-max/ghaction-github-runtime@v3

      - name: Build the images
        if: ${{ steps.affected.outputs.apps != '' }}
        run: |
          sets=()
          for app in ${{ steps.affected.outputs.apps }}; do
            sets+=(--set "$app.cache-from=type=gha,scope=$app" --set "$app.cache-to=type=gha,scope=$app,mode=max")
          done
          docker buildx bake -f infra/docker/docker-bake.hcl --load "${sets[@]}" ${{ steps.affected.outputs.apps }}
        env:
          TAG: ci
          NEXT_PUBLIC_GATEWAY_URL: https://api.example.ae
          NEXT_PUBLIC_WEB_URL: https://example.ae

      - name: Scan the images (Trivy)
        if: ${{ steps.affected.outputs.apps != '' }}
        run: |
          mkdir -p trivy
          trivy() {
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v trivy-cache:/root/.cache \
              -v "$PWD/trivy:/out" aquasec/trivy:0.58.1 image --quiet --exit-code 0 \
              --severity HIGH,CRITICAL --ignore-unfixed "$@"
          }
          for app in ${{ steps.affected.outputs.apps }}; do
            echo "::group::$app"
            trivy --format sarif --output "/out/$app.sarif" "african-market/$app:ci"
            trivy --skip-db-update --format table "african-market/$app:ci"
            echo "::endgroup::"
          done

      - name: Upload the findings
        if: ${{ steps.affected.outputs.apps != '' }}
        # Non-blocking, like the scan: a pull request from a fork cannot write findings.
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy
          category: trivy-images

  terraform:
    name: Terraform (fmt · validate)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Offline checks of infra/terraform: formatting, and that every stack is valid with the
    # pinned providers. No AWS access (that is `plan`, F0-14). Not a required check yet.
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.5
          terraform_wrapper: false

      - name: Format
        run: terraform fmt -recursive -check -diff infra/terraform

      - name: Validate
        run: |
          for stack in infra/terraform/bootstrap infra/terraform/envs/*/; do
            echo "::group::$stack"
            terraform -chdir="$stack" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="$stack" validate
            echo "::endgroup::"
          done
