name: CI

# The shared quality gate. Runs on every pull request and on every push to the three long-lived
# branches (dev -> stage -> main). Both jobs are REQUIRED status checks in the branch rulesets
# (infra/github/rulesets), so renaming a job means updating those files too.

on:
  pull_request:
  push:
    branches: [dev, stage, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NX_NO_CLOUD: 'true'

jobs:
  verify:
    name: Format · Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Integration tests in apps/*/test run under `nx test`. They create their own throwaway
    # databases on a PostGIS container they start with Testcontainers (libs/database/src/testing);
    # the Postgres service below is for the tests that boot a whole service. They
    # use their own key prefix on this Redis (rate limits). Mailpit receives the emails the SMTP
    # adapter sends. The event bus and outbox tests use their own exchange and queues on RabbitMQ.
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: am
          POSTGRES_PASSWORD: am
          POSTGRES_DB: african_market
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U am -d african_market"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mailpit:
        image: axllent/mailpit:latest
        ports: ['1025:1025', '8025:8025']
      rabbitmq:
        image: rabbitmq:3.13-alpine
        env:
          RABBITMQ_DEFAULT_USER: am
          RABBITMQ_DEFAULT_PASS: am
        ports: ['5672:5672']
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 12
    env:
      DATABASE_URL: postgres://am:am@localhost:5432/african_market
      REDIS_URL: redis://localhost:6379
      SMTP_URL: smtp://localhost:1025
      MAILPIT_URL: http://localhost:8025
      RABBITMQ_URL: amqp://am:am@localhost:5672
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # nx affected needs history to find the merge base

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Pull requests compare against their target branch (a feature PR against dev, a promotion
      # PR against stage or main). Pushes compare against the last green run on that branch.
      - name: Derive affected base and head
        uses: nrwl/nx-set-shas@v5
        with:
          main-branch-name: ${{ github.base_ref || github.ref_name }}

      - name: Format
        run: pnpm format:check

      - name: Lint · Typecheck · Test · Build (affected)
        run: pnpm nx affected -t lint typecheck test build --parallel=3

  migrations:
    name: Migrations (PostGIS)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: am
          POSTGRES_PASSWORD: am
          POSTGRES_DB: african_market
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U am -d african_market"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Throwaway values for the ephemeral CI database, not secrets.
      DATABASE_URL: postgres://am:am@localhost:5432/african_market
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Every service's migrations, in order, against an empty database. Always the full set,
      # never "affected": a migration that only works on top of local state must fail here.
      # infra/docker/postgres-init.sql is deliberately NOT applied, because RDS will not have it:
      # each service's first migration must create its own schema and extensions.
      - name: Run all migrations
        run: pnpm migration:run

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The first core journey in a real browser, in English and Arabic, against the web app, the
    # gateway and identity started on this runner. Not a required check yet: it becomes one, and
    # moves to staging, with F0-14.
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: am
          POSTGRES_PASSWORD: am
          POSTGRES_DB: african_market
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U am -d african_market"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      rabbitmq:
        image: rabbitmq:3.13-alpine
        env:
          RABBITMQ_DEFAULT_USER: am
          RABBITMQ_DEFAULT_PASS: am
        ports: ['5672:5672']
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 12
    env:
      # Throwaway values for the ephemeral CI services, not secrets.
      DATABASE_URL: postgres://am:am@localhost:5432/african_market
      REDIS_URL: redis://localhost:6379
      RABBITMQ_URL: amqp://am:am@localhost:5672
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the backend and the libraries the web app uses
        run: pnpm nx run-many -t build -p @am/identity @am/gateway @am/ui @am/api-client

      - name: Run identity migrations
        run: pnpm nx run @am/identity:migration:run

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run the end-to-end tests
        run: pnpm e2e

      - name: Upload the Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
          if-no-files-found: ignore

  terraform:
    name: Terraform (fmt · validate)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Offline checks of infra/terraform: formatting, and that every stack is valid with the
    # pinned providers. No AWS access (that is `plan`, F0-14). Not a required check yet.
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.5
          terraform_wrapper: false

      - name: Format
        run: terraform fmt -recursive -check -diff infra/terraform

      - name: Validate
        run: |
          for stack in infra/terraform/bootstrap infra/terraform/envs/*/; do
            echo "::group::$stack"
            terraform -chdir="$stack" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="$stack" validate
            echo "::endgroup::"
          done
