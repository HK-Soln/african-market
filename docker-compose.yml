# Local infrastructure. `pnpm infra:up` starts only these; services and frontends run on the host
# with `pnpm dev`.
#
# The `apps` profile also runs every app in a container, built from infra/docker:
#   pnpm stack:up      (docker compose --profile apps up -d --build)
# It uses the same host ports as `pnpm dev` (3000-3002, 4000), so run one or the other.
#
# Production equivalents: RDS PostgreSQL 16 + PostGIS, ElastiCache Redis, Amazon MQ (RabbitMQ),
# S3 + CloudFront, SES.
name: african-market

# Every key the apps read is written out: they have no defaults (decision T-45). `${X:?}` values
# come from .env (copy .env.example), and stop compose by name when missing.
x-backend-env: &backend-env
  DEPLOY_ENV: development # the containers stand in for a developer machine: console SMS, Mailpit
  LOG_LEVEL: info
  LOG_FORMAT: pretty
  CURRENT_PHASE: ${CURRENT_PHASE:?set it in .env (see .env.example)}
  EVENTS_EXCHANGE: am.events
  EVENT_RETRY_DELAYS_MS: '5000,30000,120000'
  TYPEORM_LOGGING: 'false'
  OUTBOX_POLL_MS: 500
  OTEL_EXPORTER_OTLP_ENDPOINT: none
  OTEL_TRACES_SAMPLE_RATIO: 1
  SENTRY_DSN: none
  TEST_SUPPORT_ROUTES: 'false'
  DATABASE_URL: postgres://am:am@postgres:5432/african_market
  RABBITMQ_URL: amqp://am:am@rabbitmq:5672
  REDIS_URL: redis://redis:6379
  SMTP_URL: smtp://mailpit:1025
  S3_ENDPOINT: http://minio:9000
  S3_ACCESS_KEY_ID: am-minio
  S3_SECRET_ACCESS_KEY: am-minio-secret
  S3_REGION: me-central-1
  S3_PRESIGN_ENDPOINT: http://localhost:9000
  S3_UPLOADS_BUCKET: am-media-uploads
  S3_PUBLIC_BUCKET: am-media-public
  S3_PRIVATE_BUCKET: am-media-private
  S3_CREATE_BUCKETS: 'true'
  CLOUDFRONT_DISTRIBUTION_ID: none
  KYC_PROVIDER: fake
  SELLER_APP_URL: http://localhost:3001
  DIDIT_API_URL: none
  DIDIT_API_KEY: none
  DIDIT_API_SECRET: none
  DIDIT_WORKFLOW_ID: none
  MEDIA_PUBLIC_BASE_URL: http://localhost:9000/am-media-public
  EMAIL_PROVIDER: smtp
  EMAIL_FROM: African Market <no-reply@africanmarket.local>
  SMS_PROVIDER: console # prints codes to the log: docker compose logs identity
  # Fixed codes for tests and the seed (.devcontainer sets them); none for none.
  OTP_TEST_NUMBERS: ${OTP_TEST_NUMBERS:?set it in .env, none for none (see .env.example)}
  SOCIAL_PROVIDERS: none # see .env.example
  GOOGLE_CLIENT_IDS: none
  FACEBOOK_APP_ID: none
  FACEBOOK_APP_SECRET: none
  FAKE_SOCIAL_SIGN_IN: 'false'
  JWT_ACCESS_SECRET: dev-only-access-secret-change-me-0123456789
  OTP_HMAC_SECRET: dev-only-otp-hmac-secret-change-me-0123456789
  # Each service listens on, and is reached at, its usual ports (libs/contracts/src/services.ts).
  IDENTITY_HOST: identity
  IDENTITY_TCP_PORT: 4101
  IDENTITY_HTTP_PORT: 4201
  SHOPS_HOST: shops
  SHOPS_TCP_PORT: 4102
  SHOPS_HTTP_PORT: 4202
  CATALOG_HOST: catalog
  CATALOG_TCP_PORT: 4103
  CATALOG_HTTP_PORT: 4203
  DISCOVERY_HOST: discovery
  DISCOVERY_TCP_PORT: 4104
  DISCOVERY_HTTP_PORT: 4204
  MEDIA_HOST: media
  MEDIA_TCP_PORT: 4105
  MEDIA_HTTP_PORT: 4205
  MESSAGING_HOST: messaging
  MESSAGING_TCP_PORT: 4106
  MESSAGING_HTTP_PORT: 4206
  NOTIFICATIONS_HOST: notifications
  NOTIFICATIONS_TCP_PORT: 4107
  NOTIFICATIONS_HTTP_PORT: 4207
  ORDERS_HOST: orders
  ORDERS_TCP_PORT: 4108
  ORDERS_HTTP_PORT: 4208
  PAYMENTS_HOST: payments
  PAYMENTS_TCP_PORT: 4109
  PAYMENTS_HTTP_PORT: 4209

x-backend-deps: &backend-deps
  postgres: { condition: service_healthy }
  rabbitmq: { condition: service_healthy }
  redis: { condition: service_started }

# A service: applies its migrations, then starts. Each one has its own schema, so they can migrate
# side by side.
x-service: &service
  profiles: [apps]
  command: ['migrate-and-start']
  environment: *backend-env
  depends_on: *backend-deps
  restart: unless-stopped

x-next-build-args: &next-build-args
  NEXT_PUBLIC_GATEWAY_URL: http://localhost:4000
  NEXT_PUBLIC_WEB_URL: http://localhost:3000
  NEXT_PUBLIC_SELLER_URL: http://localhost:3001
  NEXT_PUBLIC_SENTRY_DSN: none
  NEXT_PUBLIC_SENTRY_ENVIRONMENT: none
  NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: none
  # The map is off with none as the key; with one, a map id too (Google's DEMO_MAP_ID is fine).
  NEXT_PUBLIC_GOOGLE_MAPS_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_KEY:?set it in .env, none for no map}
  NEXT_PUBLIC_GOOGLE_MAP_ID: ${NEXT_PUBLIC_GOOGLE_MAP_ID:?set it in .env, none for no map}
  BUILD_ID: local

x-next: &next
  profiles: [apps]
  environment:
    GATEWAY_URL: http://gateway:4000 # server-side calls; the browser uses NEXT_PUBLIC_GATEWAY_URL
  depends_on:
    gateway: { condition: service_healthy }
  restart: unless-stopped

services:
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: am
      POSTGRES_PASSWORD: am
      POSTGRES_DB: african_market
    ports: ['${POSTGRES_HOST_PORT:?set it in .env (see .env.example)}:5432']
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/docker/postgres-init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U am -d african_market']
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports: ['${REDIS_HOST_PORT:?set it in .env (see .env.example)}:6379']

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: am
      RABBITMQ_DEFAULT_PASS: am
    ports: ['5672:5672', '15672:15672'] # 15672 = management UI (am / am)
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      retries: 10

  minio:
    # minio/minio was removed from Docker Hub; Chainguard publishes the same server binary.
    image: cgr.dev/chainguard/minio:latest
    restart: unless-stopped
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: am-minio # MinIO requires at least 3 characters
      MINIO_ROOT_PASSWORD: am-minio-secret
    ports: ['9000:9000', '9001:9001'] # 9001 = console (am-minio / am-minio-secret)
    volumes: [miniodata:/data]

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports: ['1025:1025', '8025:8025'] # 8025 = inbox UI for OTP and notification emails

  # ── tracing profile: a trace viewer for local runs ───────────────────────────────────────────
  # docker compose --profile tracing up -d jaeger, set OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318
  # in .env and restart the apps; traces at http://localhost:16686.
  jaeger:
    profiles: [tracing]
    image: jaegertracing/jaeger:2.11.0
    ports: ['16686:16686', '4318:4318'] # 16686 = UI, 4318 = OTLP over HTTP

  # ── apps profile: the whole stack in containers ──────────────────────────────────────────────

  gateway:
    profiles: [apps]
    image: african-market/gateway:local
    build: { context: ., dockerfile: infra/docker/service.Dockerfile, args: { APP: gateway } }
    environment:
      <<: *backend-env
      GATEWAY_PORT: 4000
      CORS_ORIGINS: http://localhost:3000,http://localhost:3001,http://localhost:3002
      TRUST_PROXY_HOPS: 0
      SERVICE_TIMEOUT_MS: 5000
      AUTH_THROTTLE_MULTIPLIER: 1
      COOKIE_DOMAIN: none
      COOKIE_SECURE: 'false' # plain http on this machine
    ports: ['${GATEWAY_HOST_PORT:?set it in .env (see .env.example)}:4000'] # /docs for Swagger
    depends_on:
      <<: *backend-deps
      identity: { condition: service_healthy }
    restart: unless-stopped

  identity:
    <<: *service
    image: african-market/identity:local
    build: { context: ., dockerfile: infra/docker/service.Dockerfile, args: { APP: identity } }

  shops:
    <<: *service
    image: african-market/shops:local
    build: { context: ., dockerfile: infra/docker/service.Dockerfile, args: { APP: shops } }

  catalog:
    <<: *service
    image: african-market/catalog:local
    build: { context: ., dockerfile: infra/docker/service.Dockerfile, args: { APP: catalog } }

  discovery:
    <<: *service
    image: african-market/discovery:local
    build: { context: ., dockerfile: infra/docker/service.Dockerfile, args: { APP: discovery } }

  media:
    <<: *service
    image: african-market/media:local
    build: { context: ., dockerfile: infra/docker/service.Dockerfile, args: { APP: media } }
    depends_on:
      <<: *backend-deps
      minio: { condition: service_started }

  messaging:
    <<: *service
    image: african-market/messaging:local
    build: { context: ., dockerfile: infra/docker/service.Dockerfile, args: { APP: messaging } }

  notifications:
    <<: *service
    image: african-market/notifications:local
    build: { context: ., dockerfile: infra/docker/service.Dockerfile, args: { APP: notifications } }

  orders:
    <<: *service
    image: african-market/orders:local
    build: { context: ., dockerfile: infra/docker/service.Dockerfile, args: { APP: orders } }

  payments:
    <<: *service
    image: african-market/payments:local
    build: { context: ., dockerfile: infra/docker/service.Dockerfile, args: { APP: payments } }

  web:
    <<: *next
    image: african-market/web:local
    build:
      context: .
      dockerfile: infra/docker/next.Dockerfile
      args: { APP: web, <<: *next-build-args }
    ports: ['${WEB_HOST_PORT:?set it in .env (see .env.example)}:3000']

  seller:
    <<: *next
    image: african-market/seller:local
    build:
      context: .
      dockerfile: infra/docker/next.Dockerfile
      args: { APP: seller, <<: *next-build-args }
    ports: ['3001:3000']

  admin:
    <<: *next
    image: african-market/admin:local
    build:
      context: .
      dockerfile: infra/docker/next.Dockerfile
      args: { APP: admin, <<: *next-build-args }
    ports: ['3002:3000']

volumes:
  pgdata:
  miniodata:
