name: CI

# The shared quality gate. Runs on every pull request and on every push to the three long-lived
# branches (dev -> stage -> main). Both jobs are REQUIRED status checks in the branch rulesets
# (infra/github/rulesets), so renaming a job means updating those files too.

on:
  pull_request:
  push:
    branches: [dev, stage, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NX_NO_CLOUD: 'true'

jobs:
  verify:
    name: Format · Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Integration tests in apps/*/test run under `nx test`. They create their own throwaway
    # databases on this Postgres (so geo and constraint behaviour is tested on real PostGIS) and
    # use their own key prefix on this Redis (rate limits). Mailpit receives the emails the SMTP
    # adapter sends.
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: am
          POSTGRES_PASSWORD: am
          POSTGRES_DB: african_market
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U am -d african_market"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mailpit:
        image: axllent/mailpit:latest
        ports: ['1025:1025', '8025:8025']
    env:
      DATABASE_URL: postgres://am:am@localhost:5432/african_market
      REDIS_URL: redis://localhost:6379
      SMTP_URL: smtp://localhost:1025
      MAILPIT_URL: http://localhost:8025
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # nx affected needs history to find the merge base

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Pull requests compare against their target branch (a feature PR against dev, a promotion
      # PR against stage or main). Pushes compare against the last green run on that branch.
      - name: Derive affected base and head
        uses: nrwl/nx-set-shas@v5
        with:
          main-branch-name: ${{ github.base_ref || github.ref_name }}

      - name: Format
        run: pnpm format:check

      - name: Lint · Typecheck · Test · Build (affected)
        run: pnpm nx affected -t lint typecheck test build --parallel=3

  migrations:
    name: Migrations (PostGIS)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: am
          POSTGRES_PASSWORD: am
          POSTGRES_DB: african_market
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U am -d african_market"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Throwaway values for the ephemeral CI database, not secrets.
      DATABASE_URL: postgres://am:am@localhost:5432/african_market
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Every service's migrations, in order, against an empty database. Always the full set,
      # never "affected": a migration that only works on top of local state must fail here.
      # infra/docker/postgres-init.sql is deliberately NOT applied, because RDS will not have it:
      # each service's first migration must create its own schema and extensions.
      - name: Run all migrations
        run: pnpm migration:run
