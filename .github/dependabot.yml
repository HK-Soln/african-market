version: 2

# Updates open against dev like any other feature work, so they pass through the same checks
# and promotions. Titles are prefixed so they satisfy the "PR title" check.
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Framework majors are pinned (DECISIONS T-07) and upgraded as dedicated tasks only.
      - dependency-name: '@nestjs/*'
        update-types: [version-update:semver-major]
      - dependency-name: next
        update-types: [version-update:semver-major]
      - dependency-name: react
        update-types: [version-update:semver-major]
      - dependency-name: react-dom
        update-types: [version-update:semver-major]
      - dependency-name: typeorm
        update-types: [version-update:semver-major]
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      - dependency-name: nx
        update-types: [version-update:semver-major]
      - dependency-name: next-intl
        update-types: [version-update:semver-major]
      - dependency-name: tailwindcss
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
      include: scope
    # One PR a week for every action, so updates do not queue behind each other.
    groups:
      github-actions:
        patterns: ['*']
