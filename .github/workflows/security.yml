name: Security

# Secret scanning, dependency audit and static analysis. Runs on every pull request, on pushes
# to the long-lived branches, and weekly (to catch newly disclosed CVEs in unchanged code).
# All three jobs are REQUIRED status checks in the branch rulesets (infra/github/rulesets). Container image scanning (Trivy) joins them in F0-12/F0-14,
# once the Dockerfiles exist.

on:
  pull_request:
  push:
    branches: [dev, stage, main]
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC (10:00 Dubai)

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so every commit is scanned

      # The free gitleaks CLI (MIT), not gitleaks-action, which needs a paid licence for
      # organisations.
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | sudo tar -xz -C /usr/local/bin gitleaks

      # Scans committed history, so git-ignored files such as .env never enter the scan.
      # Known non-secrets (local docker credentials, CI placeholders) are allowlisted in
      # .gitleaks.toml.
      - name: Scan
        run: gitleaks git --redact --exit-code 1

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Visibility only: everything from moderate up, dev dependencies included.
      - name: Audit (report)
        run: pnpm audit --audit-level=moderate || true

      # The gate: a critical advisory in something that ships blocks the merge.
      - name: Audit gate (critical, production dependencies)
        run: pnpm audit --prod --audit-level=critical

  codeql:
    name: CodeQL (JS/TS SAST)
    # Free on a public repository, where it is a required check. On a private repository code
    # scanning needs GitHub Code Security: the job is skipped unless CODEQL_ENABLED=true is set.
    if: github.event.repository.private == false || vars.CODEQL_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-and-quality

      - name: Analyze
        uses: github/codeql-action/analyze@v3
